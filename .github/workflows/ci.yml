name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: AsideKit build and test
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: |
          set -o pipefail
          swift build --package-path AsideKit 2>&1 | tee build.log | grep -E "error|warning: .*(Sendable|isolat)|Build complete"
      - name: Test
        run: |
          set -o pipefail
          swift test --package-path AsideKit 2>&1 | tee test.log | tail -300
